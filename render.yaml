services:
  - type: web
    name: morv2
    env: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm run start:render
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: DATA_FILE
        value: /var/data/mrv2-data.json
    healthCheckPath: /health
